name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_NAME: memfix
  GO_VERSION: '1.23'

jobs:
  # ============================================
  # Go版本: aarch64 交叉编译 (主要交付版本)
  # ============================================
  build-go-aarch64:
    name: Go Cross Build (aarch64 static)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (aarch64 static)
        run: |
          cd go/src/memfix
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../../build/memfix-aarch64 .

      - name: Verify binary
        run: |
          file build/memfix-aarch64
          ls -lh build/memfix-aarch64
          # 检查是否静态链接
          ldd build/memfix-aarch64 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-aarch64
          path: build/memfix-aarch64

  # ============================================
  # 发布 (依赖Go版本的aarch64构建)
  # ============================================
  release:
    name: Create Release
    needs: [build-go-aarch64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-aarch64
          path: release-package/

      - name: Prepare release package
        run: |
          cd release-package
          mv memfix-aarch64 memfix
          chmod +x memfix
          # 复制配置文件（根目录）
          cp ../memfix.conf . 2>/dev/null || true
          cp ../memfix.xiaomi.conf . 2>/dev/null || true
          # 复制管理脚本
          cp ../memfixctl . 2>/dev/null || true
          chmod +x memfixctl 2>/dev/null || true
          # 复制启动脚本
          cp ../S99memfix . 2>/dev/null || true
          # 复制文档
          cp ../README.md .
          cp ../CHANGELOG.md .
          cp ../LICENSE .
          # 复制源码（仅Go版本）
          mkdir -p go/src/memfix
          cp ../go/src/memfix/*.go ../go/src/memfix/go.mod go/src/memfix/ 2>/dev/null || true
          # 显示内容
          ls -la
          # 打包
          tar czf ../${{ env.PROJECT_NAME }}-${{ github.ref_name }}-aarch64.tar.gz .

      - name: Generate checksums
        run: |
          sha256sum ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-aarch64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-aarch64.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
