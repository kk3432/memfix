# ============================================
# memfix 配置文件 - 小米官方固件专用
# 小米AX3000T(联发科版 MT7981B) / 其他小米路由器
#
# 小米官方固件基于OpenWrt深度定制，特点：
#   - rootfs为squashfs只读，/etc为overlay可写
#   - /var为tmpfs内存文件系统，重启后丢失
#   - 使用procd管理服务，但有小米定制进程
#   - 特有进程: mcpd, wapi_assist, miwifi_* 等
# ============================================

# 内存检查间隔（秒）
# 小米固件256MB内存，建议30秒检查一次
check_interval = 30

# 可用内存阈值（百分比）
# 当 MemAvailable / MemTotal * 100 <= 此值时触发回收
# 小米固件系统本身占用约80-100MB，建议阈值15-20%
mem_threshold = 15

# 内存不足时重启的进程名（可选，留空不重启）
#
# 小米官方固件中已知可能存在内存泄漏的进程：
#
#   wapi_assist     - WiFi辅助管理进程，较常见泄漏
#   mcpd            - 小米配置守护进程(Mi Config Process Daemon)
#   hostapd         - AP管理进程(标准OpenWrt)
#   wpa_supplicant  - WiFi认证进程
#   dnsmasq         - DNS/DHCP服务
#   miwifi_portal   - 小米WiFi门户进程
#   uhttpd          - Web管理界面服务
#
# 注意：
#   1. 重启WiFi相关进程(wapi_assist/hostapd)会导致短暂断网(2-5秒)
#   2. 建议先不配置此项，观察仅靠缓存回收是否足够
#   3. 如需配置，建议先在低峰期测试效果
#   4. 进程名通过 'cat /proc/<pid>/comm' 查看，不是完整命令行
#
# 示例（取消注释启用）：
# restart_process = wapi_assist
restart_process =

# 是否启用 drop_caches 释放页缓存（1=启用，0=禁用）
# 写入 /proc/sys/vm/drop_caches=3，释放页缓存+目录项+inode
# 这是最安全的回收方式，在小米固件上完全兼容，建议保持启用
enable_drop_caches = 1

# 是否启用 slab 压缩（1=启用，0=禁用）
# 写入 /proc/sys/vm/compact_memory=1
# 小米固件内核支持此操作，建议保持启用
enable_slab_compact = 1

# 详细日志（1=启用，0=仅警告和错误）
# 小米固件/var/log为tmpfs，日志重启后丢失，属正常现象
# 如需持久化日志，可修改程序源码将日志路径改为/etc/memfix.log
verbose = 1
