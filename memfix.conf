# ============================================
# memfix 配置文件
# 小米AX3000T(联发科版 MT7981B) 内存泄漏修复
# 路径: /etc/memfix.conf
# ============================================

# 内存检查间隔（秒）
# 建议: 30-60秒，太频繁会增加CPU负担
check_interval = 30

# 可用内存阈值（百分比）
# 当 MemAvailable / MemTotal * 100 <= 此值时触发回收
# 256MB内存的路由器建议设为 15-20
mem_threshold = 15

# 内存不足时需要重启的进程名（可选，留空表示不重启）
# 小米官方固件中常见内存泄漏进程:
#   - wapi_assist    (WiFi辅助进程，已知有泄漏)
#   - mtkiappd       (联发科WiFi管理进程)
#   - wpa_supplicant (WiFi认证)
#   - hostapd        (AP管理)
# 注意: 重启WiFi进程会导致短暂断网(约2-5秒)
# restart_process = wapi_assist
restart_process =

# 是否启用 drop_caches 释放页缓存（1=启用，0=禁用）
# 写入 /proc/sys/vm/drop_caches=3，释放页缓存+目录项+inode
# 这是最安全的回收方式，不会影响运行中的程序
enable_drop_caches = 1

# 是否启用 slab 压缩（1=启用，0=禁用）
# 写入 /proc/sys/vm/compact_memory=1
# 对slab分配器进行碎片整理和压缩
enable_slab_compact = 1

# 详细日志（1=启用，0=仅记录警告和错误）
verbose = 1
